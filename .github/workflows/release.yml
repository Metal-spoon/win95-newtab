name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Tags pushed by tag-release.yml use GITHUB_TOKEN, which doesn't trigger
  # workflows, so that workflow calls this one directly
  workflow_call:
    inputs:
      tag:
        description: Version tag to release
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # Full history so origin/main is available for the ancestry check
      - uses: actions/checkout@v7
        if: ${{ !env.ACT }}
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      # act only uses the local working copy when no ref is given
      - uses: actions/checkout@v7
        if: ${{ env.ACT }}

      - name: Check that the tag is a version on main
        id: check
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Skipping release: $TAG is not a major.minor.patch version"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::notice::Skipping release: tag $TAG ($commit) is not on main"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $TAG ($commit)"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ !env.ACT }}
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/checkout@v7
        if: ${{ env.ACT }}

      - name: Check that the manifest version matches the tag
        run: |
          manifest=$(node -p "require('./src/manifest.json').version")
          if [ "$manifest" != "$TAG" ]; then
            echo "::error::Tag is $TAG but src/manifest.json has version $manifest"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # jQuery in src/js/lib is generated and not committed, but the release needs it
      - run: npm run prepareLibs

      - run: npm run prepareRelease

      # The archive name contains a timestamp with spaces and colons
      - name: Rename archive
        run: |
          archives=("Release Archive"/*.zip)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "::error::Expected one archive in Release Archive, found: ${archives[*]}"
            exit 1
          fi
          mv "${archives[0]}" "win95-newtab-$TAG.zip"
          unzip -l "win95-newtab-$TAG.zip"

      # act sets ACT=true; skip publishing there so local test runs can't create real releases
      - name: Create GitHub release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "win95-newtab-$TAG.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
