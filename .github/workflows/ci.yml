name: CI

# Runs for every push to a branch with an open pull request
on:
  pull_request:

# A new push makes the previous run for the same pull request obsolete
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # The tests load jQuery from src/js/lib, which is generated and not committed
      - run: npm run prepareLibs

      - name: Run tests with coverage
        run: npm run coverage -- --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      # Upload even when tests fail, so the report shows what went wrong
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            reports/
            coverage/
          if-no-files-found: ignore
